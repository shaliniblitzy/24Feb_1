        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # BlobStore Endpoints (F-201, F-202)
  # ──────────────────────────────────────────────
  /api/v1/blobstores:
    get:
      tags: [blobstores]
      summary: List all BlobStores
      description: >
        Returns all configured BlobStores. S3 credentials are automatically
        masked in responses.
      operationId: listBlobStores
      responses:
        '200':
          description: List of BlobStores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlobStoreConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [blobstores]
      summary: Create a new BlobStore
      description: >
        Creates a new BlobStore of either file (local filesystem) or s3
        (Amazon S3) type. File type requires a path, S3 type requires
        bucket, region, accessKeyId, and secretAccessKey.
      operationId: createBlobStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlobStoreCreate'
      responses:
        '201':
          description: BlobStore created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobStoreConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BlobStore with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (missing required config for type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/blobstores/{blob_store_name}:
    get:
      tags: [blobstores]
      summary: Get BlobStore by name
      description: >
        Returns configuration for a single BlobStore. S3 credentials
        are masked.
      operationId: getBlobStore
      parameters:
        - name: blob_store_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: BlobStore configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobStoreConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: BlobStore not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [blobstores]
      summary: Update BlobStore
      description: >
        Updates a BlobStore configuration. The type (file or s3) cannot
        be changed after creation.
      operationId: updateBlobStore
      parameters:
        - name: blob_store_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlobStoreCreate'
      responses:
        '200':
          description: BlobStore updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobStoreConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: BlobStore not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [blobstores]
      summary: Delete BlobStore
      description: >
        Deletes a BlobStore. Returns 409 Conflict if the BlobStore is
        currently in use by any repository.
      operationId: deleteBlobStore
      parameters:
        - name: blob_store_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: BlobStore deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: BlobStore not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BlobStore is in use by one or more repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/blobstores/{blob_store_name}/quota:
    put:
      tags: [blobstores]
      summary: Set BlobStore storage quota
      description: >
        Configures a storage quota for a BlobStore. Supported quota types
        are spaceUsedQuota and spaceRemainingQuota.
      operationId: setBlobStoreQuota
      parameters:
        - name: blob_store_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quota_type:
                  type: string
                  enum: [spaceUsedQuota, spaceRemainingQuota]
                  description: Type of quota to set
                limit:
                  type: integer
                  format: int64
                  description: Quota limit in bytes
              required:
                - quota_type
                - limit
      responses:
        '200':
          description: Quota set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobStoreConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: BlobStore not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/blobstores/{blob_store_name}/metrics:
    get:
      tags: [blobstores]
      summary: Get BlobStore storage metrics
      description: >
        Returns storage metrics for a BlobStore including total size,
        blob count, available space, and usage percentage.
      operationId: getBlobStoreMetrics
      parameters:
        - name: blob_store_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: BlobStore storage metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobStoreMetrics'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: BlobStore not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

