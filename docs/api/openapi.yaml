        a test message.
      operationId: verifyEmailConfig
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  format: email
                  description: Email address to send test message to
      responses:
        '200':
          description: Email configuration verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Email configuration is invalid
          content:
            application/json:
              schema:
