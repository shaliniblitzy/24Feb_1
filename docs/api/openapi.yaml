        Performs a dry-run evaluation of the cleanup policy and returns
        the projected impact without actually deleting any content.
      operationId: previewCleanupPolicy
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cleanup preview results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPreview'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cleanup policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cleanup-policies/run:
    post:
      tags: [cleanup]
      summary: Trigger cleanup evaluation
      description: >
        Triggers asynchronous execution of cleanup policies. Optionally
        limit to a specific repository.
      operationId: runCleanup
      parameters:
        - name: repository
          in: query
          required: false
          description: Limit cleanup to a specific repository
          schema:
            type: string
      responses:
        '202':
          description: Cleanup evaluation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cleanup evaluation initiated
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Script Endpoints (F-502)
  # ──────────────────────────────────────────────
  /api/v1/scripts:
    get:
      tags: [scripts]
      summary: List stored scripts
      description: Returns all stored script definitions.
      operationId: listScripts
      responses:
        '200':
          description: List of scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Script'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [scripts]
      summary: Create or update a script
      description: >
        Creates a new script or updates an existing one. Scripts are
        stored server-side and can be executed via the run endpoint.
      operationId: createScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptCreate'
      responses:
        '204':
          description: Script created or updated successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/scripts/{script_name}:
    get:
      tags: [scripts]
      summary: Get script by name
      description: Returns a single script definition.
      operationId: getScript
      parameters:
        - name: script_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Script details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Script not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [scripts]
      summary: Delete script
      description: Deletes a stored script.
      operationId: deleteScript
      parameters:
        - name: script_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Script deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Script not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/scripts/{script_name}/run:
    post:
      tags: [scripts]
      summary: Execute a script
      description: >
        Executes a stored script in a sandboxed environment with a
        configurable timeout. Optionally accepts JSON arguments.
      operationId: runScript
      parameters:
        - name: script_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional JSON arguments passed to the script
              additionalProperties: true
      responses:
        '200':
          description: Script execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResult'
        '400':
          description: Script execution error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Script not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Script execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Webhook Endpoints (F-503)
  # ──────────────────────────────────────────────
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks
      description: Returns all configured webhook subscriptions.
      operationId: listWebhooks
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [webhooks]
      summary: Create a webhook
      description: >
        Creates a new webhook subscription for specified event types.
        Supported events include repository.created, repository.updated,
        repository.deleted, component.uploaded, component.deleted, and
        asset.downloaded.
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/webhooks/{webhook_id}:
    get:
      tags: [webhooks]
      summary: Get webhook by ID
      description: >
        Returns a single webhook subscription. The secret_key is masked
        (only first and last 4 characters are shown).
      operationId: getWebhook
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [webhooks]
      summary: Update webhook
      description: Updates an existing webhook subscription.
      operationId: updateWebhook
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [webhooks]
      summary: Delete webhook
      description: Deletes a webhook subscription.
      operationId: deleteWebhook
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Webhook deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/webhooks/{webhook_id}/test:
    post:
      tags: [webhooks]
      summary: Send test webhook payload
      description: >
        Sends a test payload to the webhook URL and returns the delivery
        result including HTTP status code, response body, and duration.
      operationId: testWebhook
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/webhooks/{webhook_id}/deliveries:
    get:
      tags: [webhooks]
      summary: Get webhook delivery history
      description: >
        Returns the delivery history for a webhook including timestamps,
        HTTP status codes, response bodies, and durations.
      operationId: getWebhookDeliveries
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook delivery history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDelivery'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ════════════════════════════════════════════════
# Components Section
# ════════════════════════════════════════════════
components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Local username/password authentication (F-301)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication (F-301)
    apiKeyAuth:
      type: apiKey
      in: header
      name: NX-ANTI-CSRF-TOKEN
      description: API key authentication (F-304)

  schemas:

    # ──────────────────────────────────────────
    # Common / Shared Schemas
    # ──────────────────────────────────────────
    ErrorResponse:
      type: object
      description: Standard error response returned by all endpoints
      properties:
        message:
          type: string
          description: Human-readable error message
          example: Resource not found
        status:
          type: integer
          description: HTTP status code
          example: 404
      required:
        - message
        - status

    PaginatedResponse:
      type: object
      description: Generic paginated response wrapper
      properties:
        items:
          type: array
          items:
            type: object
          description: Array of result items
        continuationToken:
          type: string
          nullable: true
          description: >
            Token to retrieve the next page of results.
            Null when no more pages are available.

    # ──────────────────────────────────────────
    # Enum Schemas
    # ──────────────────────────────────────────
    RepositoryFormat:
      type: string
      description: Supported repository formats (F-101)
      enum:
        - maven2
        - npm
        - docker
        - nuget
        - pypi
        - apt
        - raw

    RepositoryType:
      type: string
      description: Repository type definitions (F-102)
      enum:
        - hosted
        - proxy
        - group

    UserStatus:
      type: string
      description: User account status values
      enum:
        - active
        - locked
        - disabled
        - changepassword

    TaskStatus:
      type: string
      description: Task execution status values
      enum:
        - waiting
        - running
        - ok
        - failed
        - canceled

    PrivilegeType:
      type: string
      description: Privilege descriptor types (F-301)
      enum:
        - application
        - repository-admin
        - repository-view
        - repository-content-selector
        - wildcard

    HealthStatus:
      type: string
      description: Health check status values (F-401)
      enum:
        - healthy
        - degraded
        - unhealthy

    BlobStoreType:
      type: string
      description: BlobStore backend types (F-201, F-202)
      enum:
        - file
        - s3

    WebhookEventType:
      type: string
      description: Supported webhook event types (F-503)
      enum:
        - repository.created
        - repository.updated
        - repository.deleted
        - component.uploaded
        - component.deleted
        - asset.downloaded

    # ──────────────────────────────────────────
    # Health Schemas (F-401)
    # ──────────────────────────────────────────
    CompositeHealthResult:
      type: object
      description: Aggregated health status from all registered checks
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckResult'
        total_duration_ms:
          type: number
          format: double
          description: Total time to execute all health checks in milliseconds
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check execution
        node_id:
          type: string
          description: Identifier of the node that performed the check
      required:
        - status
        - checks
        - total_duration_ms
        - timestamp
        - node_id

    HealthCheckResult:
      type: object
      description: Result of a single health check
      properties:
        name:
          type: string
          description: Name of the health check (e.g., database, elasticsearch)
          example: database
        status:
          $ref: '#/components/schemas/HealthStatus'
        message:
          type: string
          nullable: true
          description: Additional status message or error details
        duration_ms:
          type: number
          format: double
          description: Time to execute this health check in milliseconds
        critical:
          type: boolean
          description: Whether this check is critical to system operation
      required:
        - name
        - status
        - duration_ms
        - critical

    SystemInfo:
      type: object
      description: Detailed system information (authenticated endpoint)
      properties:
        python_version:
          type: string
          example: '3.12.3'
        flask_version:
          type: string
          example: '3.1.3'
        uptime_seconds:
          type: number
          format: double
          description: Application uptime in seconds
        os_info:
          type: string
          description: Operating system information
          example: Linux 6.1.0-amd64
        database_type:
          type: string
          description: Active database backend
          enum: [sqlite, postgresql]
        node_id:
          type: string
          description: Unique node identifier
        started_at:
          type: string
          format: date-time
          description: Application start timestamp
      required:
        - python_version
        - flask_version
        - uptime_seconds
        - os_info
        - database_type
        - node_id
        - started_at

    # ──────────────────────────────────────────
    # Repository Schemas (F-101, F-102)
    # ──────────────────────────────────────────
    RepositoryCreate:
      type: object
      description: Request schema for creating a new repository
      properties:
        name:
          type: string
          description: >
            Unique repository name. Must start with alphanumeric and
            contain only alphanumeric, dot, underscore, or hyphen.
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
          maxLength: 200
          example: maven-releases
        format:
          $ref: '#/components/schemas/RepositoryFormat'
        type:
          $ref: '#/components/schemas/RepositoryType'
        blob_store_name:
          type: string
          description: Name of the BlobStore to use for storage
          example: default
        online:
          type: boolean
          description: Whether the repository should be online
          default: true
        attributes:
          type: object
          description: >
            Type-specific configuration attributes. Proxy repositories
            must include proxy.remoteUrl. Group repositories must include
            group.memberNames.
          additionalProperties: true
          example:
            proxy:
              remoteUrl: https://repo1.maven.org/maven2/
            storage:
              writePolicy: ALLOW_ONCE
        routing_rule:
          type: string
          nullable: true
          description: Optional routing rule name
        cleanup_policies:
          type: array
          items:
            type: string
          description: List of cleanup policy names applied to this repository
      required:
        - name
        - format
        - type
        - blob_store_name

    RepositoryUpdate:
      type: object
      description: >
        Request schema for updating a repository. Name, format, and type
        are immutable and cannot be changed.
      properties:
        online:
          type: boolean
          description: Whether the repository should be online
        blob_store_name:
          type: string
          description: Name of the BlobStore to use for storage
        attributes:
          type: object
          description: Type-specific configuration attributes
          additionalProperties: true
        routing_rule:
          type: string
          nullable: true
          description: Routing rule name
        cleanup_policies:
          type: array
          items:
            type: string
          description: List of cleanup policy names

    RepositoryResponse:
      type: object
      description: Repository details returned by API
      properties:
        name:
          type: string
          example: maven-releases
        format:
          $ref: '#/components/schemas/RepositoryFormat'
        type:
          $ref: '#/components/schemas/RepositoryType'
        blob_store_name:
          type: string
          example: default
        online:
          type: boolean
        attributes:
          type: object
          additionalProperties: true
        routing_rule:
          type: string
          nullable: true
        cleanup_policies:
          type: array
          items:
            type: string
        component_count:
          type: integer
          description: Total number of components in the repository
        asset_count:
          type: integer
          description: Total number of assets in the repository
        status:
          type: string
          description: Repository lifecycle status
          example: started
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - name
        - format
        - type
        - blob_store_name
        - online
        - status
        - created_at
        - updated_at

    # ──────────────────────────────────────────
    # Component Schemas (F-101, F-103)
    # ──────────────────────────────────────────
    Component:
      type: object
      description: Component summary within a repository
      properties:
        id:
          type: integer
          description: Unique component identifier
        repository_name:
          type: string
          description: Repository containing this component
        namespace:
          type: string
          nullable: true
          description: Component namespace or group (e.g., Maven groupId)
        name:
          type: string
          description: Component name (e.g., Maven artifactId)
        version:
          type: string
          description: Component version
        format:
          $ref: '#/components/schemas/RepositoryFormat'
        attributes:
          type: object
          additionalProperties: true
          description: Format-specific component attributes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - repository_name
        - name
        - version
        - format

    ComponentDetail:
      type: object
      description: Detailed component view with nested assets
      allOf:
        - $ref: '#/components/schemas/Component'
        - type: object
          properties:
            assets:
              type: array
              items:
                $ref: '#/components/schemas/AssetResponse'
              description: All assets associated with this component

    ComponentSearchResult:
      type: object
      description: Paginated component listing result
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        continuationToken:
          type: string
          nullable: true
          description: Token for retrieving the next page

    ComponentUpload:
      type: object
      description: Multipart form data for component upload
      properties:
        repository_name:
          type: string
          description: Target hosted repository
        namespace:
          type: string
          nullable: true
          description: Component namespace or group
        name:
          type: string
          description: Component name
        version:
          type: string
          description: Component version
        file:
          type: string
          format: binary
          description: Primary asset file
      required:
        - repository_name
        - name
        - version
        - file

    # ──────────────────────────────────────────
    # Asset Schemas
    # ──────────────────────────────────────────
    AssetResponse:
      type: object
      description: Asset metadata response
      properties:
        id:
          type: integer
          description: Unique asset identifier
        component_id:
          type: integer
          nullable: true
          description: ID of the parent component
        repository_name:
          type: string
          description: Repository containing this asset
        path:
          type: string
          description: Asset path within the repository
          example: /org/example/artifact/1.0/artifact-1.0.jar
        content_type:
          type: string
          description: MIME type of the asset
          example: application/java-archive
        size:
          type: integer
          format: int64
          description: Asset size in bytes
        checksums:
          type: object
          properties:
            sha1:
              type: string
              description: SHA-1 checksum (40 hex chars)
              example: da39a3ee5e6b4b0d3255bfef95601890afd80709
            sha256:
              type: string
              description: SHA-256 checksum (64 hex chars)
            md5:
              type: string
              description: MD5 checksum (32 hex chars)
        last_downloaded:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last download
        download_url:
          type: string
          format: uri
          description: URL to download this asset
        attributes:
          type: object
          additionalProperties: true
          description: Format-specific asset attributes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - repository_name
        - path
        - content_type
        - size
        - checksums

    # ──────────────────────────────────────────
    # User Schemas (F-301)
    # ──────────────────────────────────────────
    UserCreate:
      type: object
      description: >
        Request to create a new user. Password must meet policy requirements:
        minimum 8 characters, at least 1 uppercase, 1 lowercase, 1 digit.
      properties:
        user_id:
          type: string
          description: Unique user identifier (login name)
          example: jdoe
        password:
          type: string
          format: password
          description: User password (min 8 chars, 1 upper, 1 lower, 1 digit)
          minLength: 8
        status:
          $ref: '#/components/schemas/UserStatus'
        email:
          type: string
          format: email
          description: User email address
        first_name:
          type: string
          description: User first name
        last_name:
          type: string
          description: User last name
        roles:
          type: array
          items:
            type: string
          description: List of role IDs to assign to the user
      required:
        - user_id
        - password

    UserUpdate:
      type: object
      description: >
        Request to update a user. Does not allow password changes;
        use the change-password endpoint instead.
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        roles:
          type: array
          items:
            type: string

    UserResponse:
      type: object
      description: >
        User account details. CRITICAL: Never includes password_hash,
        api_key, or failed_login_count fields.
      properties:
        user_id:
          type: string
          example: jdoe
        status:
          $ref: '#/components/schemas/UserStatus'
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        roles:
          type: array
          items:
            type: string
          description: Assigned role IDs
        last_login:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last successful login
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - user_id
        - status

    UserChangePassword:
      type: object
      description: Request to change a user password
      properties:
        current_password:
          type: string
          format: password
          description: Current password for verification
        new_password:
          type: string
          format: password
          description: New password (min 8 chars, 1 upper, 1 lower, 1 digit)
          minLength: 8
      required:
        - current_password
        - new_password

    UserApiKey:
      type: object
      description: >
        Generated API key response. The key is shown ONLY at generation
        time and cannot be retrieved later.
      properties:
        api_key:
          type: string
          description: Generated API key (shown only once)
        created_at:
          type: string
          format: date-time
      required:
        - api_key
        - created_at

    # ──────────────────────────────────────────
    # Role Schemas (F-301)
    # ──────────────────────────────────────────
    Role:
      type: object
      description: Role definition with associated privileges
      properties:
        role_id:
          type: string
          description: Unique role identifier
          example: nx-admin
        name:
          type: string
          description: Human-readable role name
          example: Nexus Administrator
        description:
          type: string
          nullable: true
          description: Role description
        privileges:
          type: array
          items:
            type: string
          description: List of privilege IDs assigned to this role
        source:
          type: string
          enum: [internal, external]
          description: Whether the role is defined internally or from external source
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - role_id
        - name
        - privileges
        - source

    RoleCreate:
      type: object
      description: Request to create or update a role
      properties:
        role_id:
          type: string
          description: Unique role identifier
        name:
          type: string
          description: Human-readable role name
        description:
          type: string
          nullable: true
        privileges:
          type: array
          items:
            type: string
          description: List of privilege IDs
        source:
          type: string
          enum: [internal, external]
          default: internal
      required:
        - role_id
        - name
        - privileges

    RoleAssignment:
      type: object
      description: Role-to-user assignment
      properties:
        role_id:
          type: string
        user_id:
          type: string
      required:
        - role_id
        - user_id

    RoleBulkAssignment:
      type: object
      description: Bulk user assignment to a role
      properties:
        user_ids:
          type: array
          items:
            type: string
          description: List of user IDs to assign to the role
      required:
        - user_ids

    # ──────────────────────────────────────────
    # Privilege Schemas (F-301)
    # ──────────────────────────────────────────
    Privilege:
      type: object
      description: >
        Privilege descriptor. Five types supported: application,
        repository-admin, repository-view, repository-content-selector,
        and wildcard.
      properties:
        privilege_id:
          type: string
          description: Unique privilege identifier
        type:
          $ref: '#/components/schemas/PrivilegeType'
        name:
          type: string
          description: Human-readable privilege name
        description:
          type: string
          nullable: true
        properties:
          type: object
          description: >
            Type-specific privilege properties. For repository types,
            includes format, repository, and actions. For
            repository-content-selector, includes contentSelector.
          additionalProperties: true
        read_only:
          type: boolean
          description: Whether this is a built-in privilege
        created_at:
          type: string
          format: date-time
      required:
        - privilege_id
        - type
        - name

    PrivilegeCreate:
      type: object
      description: Request to create or update a privilege
      properties:
        privilege_id:
          type: string
        type:
          $ref: '#/components/schemas/PrivilegeType'
        name:
          type: string
        description:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties: true
          description: >
            Type-specific properties. For application: domain, actions.
            For repository-admin: format, repository.
            For repository-view: format, repository, actions.
            For repository-content-selector: format, repository,
            contentSelector, actions. For wildcard: pattern.
      required:
        - privilege_id
        - type
        - name

    # ──────────────────────────────────────────
    # Content Selector Schemas (F-301)
    # ──────────────────────────────────────────
    ContentSelector:
      type: object
      description: Content selector for sub-repository access control
      properties:
        selector_id:
          type: string
          description: Unique content selector identifier
        name:
          type: string
          description: Human-readable selector name
        type:
          type: string
          default: csel
          description: Selector type (always csel)
        expression:
          type: string
          description: CSEL expression for path matching
          example: 'path =^ "/org/example/"'
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - selector_id
        - name
        - type
        - expression

    ContentSelectorCreate:
      type: object
      description: Request to create or update a content selector
      properties:
        name:
          type: string
          description: Content selector name
        type:
          type: string
          default: csel
        expression:
          type: string
          description: CSEL expression
        description:
          type: string
          nullable: true
      required:
        - name
        - expression

    # ──────────────────────────────────────────
    # Task Schemas (F-402)
    # ──────────────────────────────────────────
    TaskCreate:
      type: object
      description: >
        Request to create a scheduled task. Supports standard 5-field
        cron expressions for scheduling.
      properties:
        type:
          type: string
          description: >
            Task type identifier (e.g., repository.cleanup,
            blobstore.compact, repository.rebuild-index)
          example: repository.cleanup
        name:
          type: string
          description: Human-readable task name
          example: Nightly Cleanup
        cron_expression:
          type: string
          description: Standard 5-field cron expression
          example: '0 2 * * *'
        enabled:
          type: boolean
          default: true
          description: Whether the task is enabled for scheduled execution
        configuration:
          type: object
          additionalProperties: true
          description: Task-specific configuration parameters
      required:
        - type
        - name
        - cron_expression

    TaskDefinition:
      type: object
      description: Complete task definition with scheduling details
      properties:
        task_id:
          type: string
          description: Unique task identifier
        type:
          type: string
          description: Task type identifier
        name:
          type: string
          description: Human-readable task name
        cron_expression:
          type: string
          description: Cron schedule expression
        enabled:
          type: boolean
          description: Whether the task is enabled
        configuration:
          type: object
          additionalProperties: true
          description: Task-specific configuration
        last_run:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last execution
        last_status:
          $ref: '#/components/schemas/TaskStatus'
        next_run:
          type: string
          format: date-time
          nullable: true
          description: Scheduled time of next execution
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - task_id
        - type
        - name
        - cron_expression
        - enabled

    TaskExecution:
      type: object
      description: Record of a single task execution
      properties:
        execution_id:
          type: string
          description: Unique execution identifier
        task_id:
          type: string
          description: ID of the task that was executed
        start_time:
          type: string
          format: date-time
          description: Execution start timestamp
        end_time:
          type: string
          format: date-time
          nullable: true
          description: Execution end timestamp (null if still running)
        status:
          $ref: '#/components/schemas/TaskStatus'
        duration_ms:
          type: integer
          format: int64
          nullable: true
          description: Execution duration in milliseconds
        progress:
          type: number
          format: double
          nullable: true
          description: Execution progress (0.0 to 1.0)
          minimum: 0
          maximum: 1
        error_message:
          type: string
          nullable: true
          description: Error details if execution failed
      required:
        - execution_id
        - task_id
        - start_time
        - status

    # ──────────────────────────────────────────
    # System Schemas (F-404)
    # ──────────────────────────────────────────
    SystemConfig:
      type: object
      description: System configuration key-value pair
      properties:
        key:
          type: string
          description: Configuration key
          example: system.baseUrl
        value:
          type: string
          description: >
            Configuration value. Sensitive values (containing password,
            secret, token, or key in the key name) are automatically masked.
          example: https://nexus.example.com
        category:
          type: string
          description: Configuration category
          enum: [security, http, system, email, repository, cleanup, scheduling]
        description:
          type: string
          nullable: true
          description: Human-readable description of the configuration
      required:
        - key
        - value
        - category

    SystemConfigUpdate:
      type: object
      description: Request to update a system configuration value
      properties:
        value:
          type: string
          description: New configuration value
        description:
          type: string
          nullable: true
          description: Optional updated description
      required:
        - value

    SystemStatus:
      type: object
      description: Comprehensive system status information
      properties:
        version:
          type: string
          description: Application version
          example: '1.0.0'
        edition:
          type: string
          description: Product edition
          enum: [OSS, PRO]
          example: OSS
        uptime_seconds:
          type: number
          format: double
          description: Application uptime in seconds
        started_at:
          type: string
          format: date-time
          description: Application start timestamp
        node_id:
          type: string
          description: Unique node identifier
        python_version:
          type: string
          example: '3.12.3'
        flask_version:
          type: string
          example: '3.1.3'
        database_type:
          type: string
          enum: [sqlite, postgresql]
        elasticsearch_available:
          type: boolean
          description: Whether Elasticsearch is connected and available
        counts:
          type: object
          properties:
            blob_stores:
              type: integer
            repositories:
              type: integer
            components:
              type: integer
            assets:
              type: integer
            users:
              type: integer
      required:
        - version
        - edition
        - uptime_seconds
        - started_at
        - node_id
        - python_version
        - flask_version
        - database_type
        - elasticsearch_available
        - counts

    LicenseInfo:
      type: object
      description: Product license information
      properties:
        product_name:
          type: string
          example: Sonatype Nexus Repository Manager
        edition:
          type: string
          enum: [OSS, PRO]
        license_type:
          type: string
          description: Type of license
          example: Open Source
        features:
          type: array
          items:
            type: string
          description: List of available features
        expiration_date:
          type: string
          format: date-time
          nullable: true
          description: License expiration date (null for perpetual)
        is_valid:
          type: boolean
          description: Whether the license is currently valid
      required:
        - product_name
        - edition
        - license_type
        - features
        - is_valid

    # ──────────────────────────────────────────
    # Search Schemas (F-103)
    # ──────────────────────────────────────────
    SearchResult:
      type: object
      description: Search result with pagination and facets
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
          description: Array of matching items
        total_count:
          type: integer
          description: Total number of matching items
        page:
          type: integer
          description: Current page number (zero-based)
        page_size:
          type: integer
          description: Number of items per page
        continuation_token:
          type: string
          nullable: true
          description: Token for retrieving additional results
        facets:
          type: object
          description: Aggregation counts by field
          properties:
            format:
              type: object
              additionalProperties:
                type: integer
              description: Count of results per format
            repository:
              type: object
              additionalProperties:
                type: integer
              description: Count of results per repository
      required:
        - items
        - total_count
        - page
        - page_size

    SearchResultItem:
      type: object
      description: Single item in search results
      properties:
        id:
          type: integer
          description: Component or asset identifier
        repository_name:
          type: string
        format:
          $ref: '#/components/schemas/RepositoryFormat'
        namespace:
          type: string
          nullable: true
        name:
          type: string
        version:
          type: string
        assets:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultAsset'
      required:
        - id
        - repository_name
        - name
        - version

    SearchResultAsset:
      type: object
      description: Asset summary within search results
      properties:
        id:
          type: integer
        path:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        download_url:
          type: string
          format: uri

    # ──────────────────────────────────────────
    # BlobStore Schemas (F-201, F-202)
    # ──────────────────────────────────────────
    BlobStoreConfig:
      type: object
      description: >
        BlobStore configuration. S3 credentials (accessKeyId,
        secretAccessKey) are masked in responses.
      properties:
        blob_store_name:
          type: string
          description: Unique BlobStore name
          example: default
        type:
          $ref: '#/components/schemas/BlobStoreType'
        configuration:
          type: object
          description: >
            Type-specific configuration. For file: path.
            For S3: bucket, region, accessKeyId (masked),
            secretAccessKey (masked), prefix, encryption_type.
          additionalProperties: true
        total_size:
          type: integer
          format: int64
          description: Total storage size in bytes
        blob_count:
          type: integer
          description: Total number of blobs stored
        quota:
          type: object
          nullable: true
          properties:
            quota_type:
              type: string
              enum: [spaceUsedQuota, spaceRemainingQuota]
            limit:
              type: integer
              format: int64
              description: Quota limit in bytes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - blob_store_name
        - type
        - configuration

    BlobStoreCreate:
      type: object
      description: >
        Request to create a BlobStore. File type requires path.
        S3 type requires bucket, region, accessKeyId, and secretAccessKey.
      properties:
        blob_store_name:
          type: string
          description: Unique BlobStore name
        type:
          $ref: '#/components/schemas/BlobStoreType'
        configuration:
          type: object
          description: >
            For file type: { path: "/data/blobs" }.
            For S3 type: { bucket: "my-bucket", region: "us-east-1",
            accessKeyId: "...", secretAccessKey: "...", prefix: "",
            encryption_type: "s3ManagedEncryption" }
          additionalProperties: true
      required:
        - blob_store_name
        - type
        - configuration

    BlobStoreMetrics:
      type: object
      description: Storage metrics for a BlobStore
      properties:
        blob_store_name:
          type: string
        total_size:
          type: integer
          format: int64
          description: Total storage used in bytes
        blob_count:
          type: integer
          description: Total number of blobs
        available_space:
          type: integer
          format: int64
          description: Available space in bytes (-1 for unlimited S3)
        usage_percentage:
          type: number
          format: double
          description: Storage usage as a percentage (0.0 to 100.0)
          minimum: 0
          maximum: 100
      required:
        - blob_store_name
        - total_size
        - blob_count
        - available_space
        - usage_percentage

    # ──────────────────────────────────────────
    # Cleanup Policy Schemas (F-204)
    # ──────────────────────────────────────────
    CleanupPolicy:
      type: object
      description: Cleanup policy definition with criteria
      properties:
        policy_id:
          type: string
          description: Unique policy identifier
        name:
          type: string
          description: Human-readable policy name
          example: Delete old snapshots
        format:
          $ref: '#/components/schemas/RepositoryFormat'
        criteria:
          type: object
          description: >
            Cleanup criteria applied to matching components/assets.
            All specified criteria are AND-ed together.
          properties:
            lastBlobUpdated:
              type: integer
              description: >
                Remove components not updated within this many days
            lastDownloaded:
              type: integer
              description: >
                Remove components not downloaded within this many days
            isPrerelease:
              type: boolean
              description: >
                If true, only match pre-release/snapshot versions
            regex:
              type: string
              description: >
                Regular expression to match component version strings
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - policy_id
        - name
        - criteria

    CleanupPolicyCreate:
      type: object
      description: Request to create or update a cleanup policy
      properties:
        name:
          type: string
          description: Policy name
        format:
          $ref: '#/components/schemas/RepositoryFormat'
        criteria:
          type: object
          properties:
            lastBlobUpdated:
              type: integer
            lastDownloaded:
              type: integer
            isPrerelease:
              type: boolean
            regex:
              type: string
      required:
        - name
        - criteria

    CleanupPreview:
      type: object
      description: Preview of cleanup policy impact (dry-run)
      properties:
        policy_id:
          type: string
        total_components:
          type: integer
          description: Number of components that would be affected
        total_assets:
          type: integer
          description: Number of assets that would be affected
        estimated_space_reclaimed:
          type: integer
          format: int64
          description: Estimated storage space reclaimed in bytes
      required:
        - policy_id
        - total_components
        - total_assets
        - estimated_space_reclaimed

    # ──────────────────────────────────────────
    # Script Schemas (F-502)
    # ──────────────────────────────────────────
    Script:
      type: object
      description: Stored script definition
      properties:
        name:
          type: string
          description: Unique script name
          example: my-cleanup-script
        type:
          type: string
          description: Script language type
          enum: [python]
          example: python
        content:
          type: string
          description: Script source code
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - name
        - type
        - content

    ScriptCreate:
      type: object
      description: Request to create or update a script
      properties:
        name:
          type: string
          description: Unique script name
        type:
          type: string
          enum: [python]
          description: Script language type
        content:
          type: string
          description: Script source code
      required:
        - name
        - type
        - content

    ScriptResult:
      type: object
      description: Result of script execution
      properties:
        name:
          type: string
          description: Name of the executed script
        result:
          type: string
          nullable: true
          description: JSON-serialized execution result
        type:
          type: string
          enum: [python]
      required:
        - name
        - result

    # ──────────────────────────────────────────
    # Webhook Schemas (F-503)
    # ──────────────────────────────────────────
    Webhook:
      type: object
      description: >
        Webhook subscription. The secret_key is masked in responses
        (only first and last 4 characters shown).
      properties:
        webhook_id:
          type: string
          description: Unique webhook identifier
        name:
          type: string
          description: Human-readable webhook name
        url:
          type: string
          format: uri
          description: Destination URL for webhook payloads
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Event types this webhook subscribes to
        secret_key:
          type: string
          nullable: true
          description: >
            HMAC signing secret (masked in responses — only first/last
            4 chars visible)
        content_type:
          type: string
          default: application/json
          description: Content-Type header for webhook payloads
        enabled:
          type: boolean
          description: Whether the webhook is active
        repository_filter:
          type: string
          nullable: true
          description: Optional repository name filter
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - webhook_id
        - name
        - url
        - event_types
        - enabled

    WebhookCreate:
      type: object
      description: Request to create or update a webhook subscription
      properties:
        name:
          type: string
          description: Webhook name
        url:
          type: string
          format: uri
          description: Destination URL
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: List of event types to subscribe to
          minItems: 1
        secret_key:
          type: string
          nullable: true
          description: HMAC signing secret for payload verification
        content_type:
          type: string
          default: application/json
        enabled:
          type: boolean
          default: true
        repository_filter:
          type: string
          nullable: true
          description: Optional repository name filter
      required:
        - name
        - url
        - event_types

    WebhookDelivery:
      type: object
      description: Record of a webhook delivery attempt
      properties:
        delivery_id:
          type: string
          description: Unique delivery identifier
        webhook_id:
          type: string
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        status_code:
          type: integer
          description: HTTP response status code from the target
        response_body:
          type: string
          nullable: true
          description: Response body from the target (truncated if large)
        duration_ms:
          type: integer
          description: Round-trip delivery time in milliseconds
        success:
          type: boolean
          description: Whether the delivery was successful (2xx response)
        timestamp:
          type: string
          format: date-time
          description: Delivery attempt timestamp
        error_message:
          type: string
          nullable: true
          description: Error message if delivery failed
      required:
        - delivery_id
        - webhook_id
        - event_type
        - status_code
        - duration_ms
        - success
        - timestamp

    # ──────────────────────────────────────────
    # Certificate Schemas (F-302)
    # ──────────────────────────────────────────
    CertificateInfo:
      type: object
      description: >
        SSL/TLS certificate information. Never includes private key
        material.
      properties:
        subject:
          type: string
          description: Certificate subject distinguished name
          example: CN=nexus.example.com
        issuer:
          type: string
          description: Certificate issuer distinguished name
          example: CN=Let's Encrypt Authority X3
        serial_number:
          type: string
          description: Certificate serial number in hexadecimal
        not_before:
          type: string
          format: date-time
          description: Certificate validity start date
        not_after:
          type: string
          format: date-time
          description: Certificate validity end date (expiration)
        fingerprint_sha256:
          type: string
          description: SHA-256 fingerprint of the certificate
        fingerprint_sha1:
          type: string
          description: SHA-1 fingerprint of the certificate
        pem:
          type: string
          nullable: true
          description: PEM-encoded certificate (included on retrieval)
      required:
        - subject
        - issuer
        - serial_number
        - not_before
        - not_after
        - fingerprint_sha256
