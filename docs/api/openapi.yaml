openapi: '3.0.3'

info:
  title: Sonatype Nexus Repository Manager API
  description: >
    REST API for Sonatype Nexus Repository Manager — a universal binary repository
    manager supporting Maven, npm, Docker, NuGet, PyPI, APT, and Raw formats.
    Reimplemented in Python 3 / Flask 3.1.3. Provides repository management,
    component/asset operations, security (RBAC), system configuration, search,
    health monitoring, scheduled tasks, BlobStore management, cleanup policies,
    scripting, webhook integration, and SSL/TLS certificate management.
  version: '1.0.0'
  contact:
    name: Nexus Repository Team
  license:
    name: Eclipse Public License 2.0
    url: https://www.eclipse.org/legal/epl-2.0/

servers:
  - url: /
    description: Local development server
  - url: https://nexus.example.com
    description: Production server

tags:
  - name: health
    description: Health status, readiness probes, and monitoring (F-401)
  - name: repositories
    description: Repository management operations — CRUD for Hosted, Proxy, Group types (F-501-RQ-001)
  - name: components
    description: Component upload, download, and management (F-501-RQ-002)
  - name: assets
    description: Asset download, metadata, and management (F-501-RQ-002)
  - name: search
    description: Full-text search across repositories (F-103)
  - name: users
    description: User account management (F-501-RQ-003)
  - name: roles
    description: Role and role assignment management (F-501-RQ-003)
  - name: privileges
    description: Privilege and content selector management (F-501-RQ-003)
  - name: security
    description: SSL/TLS certificate management (F-302)
  - name: tasks
    description: Scheduled task management and execution (F-402, F-501-RQ-004)
  - name: system
    description: System configuration and management (F-404, F-501-RQ-004)
  - name: blobstores
    description: BlobStore management and configuration (F-201, F-202)
  - name: cleanup
    description: Cleanup policy management and execution (F-204)
  - name: scripts
    description: Script storage and execution (F-502)
  - name: webhooks
    description: Webhook configuration for event-driven integrations (F-503)

security:
  - basicAuth: []
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  # ──────────────────────────────────────────────
  # Health Endpoints (F-401)
  # ──────────────────────────────────────────────
  /api/v1/health:
    get:
      tags: [health]
      summary: Get system health status
      description: >
        Returns composite health status aggregating all registered health checks
        including database connectivity, Elasticsearch availability, BlobStore
        accessibility, and system resource utilization.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: System is healthy or degraded but operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeHealthResult'
        '503':
          description: System is unhealthy — one or more critical checks failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositeHealthResult'

  /api/v1/health/live:
    get:
      tags: [health]
      summary: Kubernetes liveness probe
      description: >
        Lightweight liveness check indicating the application process is running.
        Always returns 200 if the Flask application is responsive.
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Application is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [alive]
                    example: alive
                  timestamp:
                    type: string
                    format: date-time
                required:
                  - status
                  - timestamp

  /api/v1/health/ready:
    get:
      tags: [health]
      summary: Kubernetes readiness probe
      description: >
        Readiness check verifying the application can accept traffic.
        Returns 503 if critical dependencies (database, BlobStore) are unavailable.
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Application is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
                    example: ready
                  timestamp:
                    type: string
                    format: date-time
                required:
                  - status
                  - timestamp
        '503':
          description: Application is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [not_ready]
                    example: not_ready
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/health/{check_name}:
    get:
      tags: [health]
      summary: Get individual health check result
      description: >
        Returns the result of a specific named health check such as database,
        elasticsearch, or blobstore.
      operationId: getHealthCheck
      security: []
      parameters:
        - name: check_name
          in: path
          required: true
          description: Name of the health check (e.g., database, elasticsearch, blobstore)
          schema:
            type: string
            example: database
      responses:
        '200':
          description: Health check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResult'
        '404':
          description: Unknown health check name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/health/system:
    get:
      tags: [health]
      summary: Get system information
      description: >
        Returns detailed system information including Python version, Flask version,
        uptime, operating system details, database type, and node identifier.
        Requires authentication.
      operationId: getSystemInfo
      security:
        - basicAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Repository Endpoints (F-501-RQ-001)
  # ──────────────────────────────────────────────
  /api/v1/repositories:
    get:
      tags: [repositories]
      summary: List all repositories
      description: >
        Returns a list of all configured repositories, optionally filtered by
        format and/or type. Supports Maven, npm, Docker, NuGet, PyPI, APT, and
        Raw formats in Hosted, Proxy, and Group types (F-101, F-102).
      operationId: listRepositories
      parameters:
        - name: format
          in: query
          required: false
          description: Filter by repository format
          schema:
            $ref: '#/components/schemas/RepositoryFormat'
        - name: type
          in: query
          required: false
          description: Filter by repository type
          schema:
            $ref: '#/components/schemas/RepositoryType'
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [repositories]
      summary: Create a new repository
      description: >
        Creates a new repository with the specified format, type, and configuration.
        Name must match pattern ^[a-zA-Z0-9][a-zA-Z0-9._-]*$. Proxy repositories
        require attributes.proxy.remoteUrl. Group repositories require
        attributes.group.memberNames.
      operationId: createRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryCreate'
      responses:
        '201':
          description: Repository created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Repository with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/repositories/{repository_name}:
    get:
      tags: [repositories]
      summary: Get repository by name
      description: Returns detailed information for a single repository.
      operationId: getRepository
      parameters:
        - name: repository_name
          in: path
          required: true
          description: Unique repository name
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Repository details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [repositories]
      summary: Update repository
      description: >
        Updates an existing repository configuration. The name, format, and type
        fields are immutable and cannot be changed after creation.
      operationId: updateRepository
      parameters:
        - name: repository_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryUpdate'
      responses:
        '200':
          description: Repository updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [repositories]
      summary: Delete repository
      description: Permanently deletes a repository and all its contents.
      operationId: deleteRepository
      parameters:
        - name: repository_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '204':
          description: Repository deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/repositories/{repository_name}/status:
    put:
      tags: [repositories]
      summary: Set repository online/offline status
      description: Changes the online status of a repository.
      operationId: setRepositoryStatus
      parameters:
        - name: repository_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                online:
                  type: boolean
                  description: Whether the repository should be online
              required:
                - online
      responses:
        '200':
          description: Repository status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/repositories/{repository_name}/rebuild-index:
    post:
      tags: [repositories]
      summary: Trigger index rebuild
      description: >
        Initiates an asynchronous rebuild of the repository search index.
        Returns 202 Accepted immediately.
      operationId: rebuildRepositoryIndex
      parameters:
        - name: repository_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '202':
          description: Index rebuild initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Index rebuild initiated for repository
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/repositories/{repository_name}/invalidate-cache:
    post:
      tags: [repositories]
      summary: Invalidate proxy cache
      description: >
        Invalidates the local cache for a proxy repository, forcing fresh
        retrieval from the remote source on next request.
      operationId: invalidateRepositoryCache
      parameters:
        - name: repository_name
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '204':
          description: Cache invalidated successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Component Endpoints (F-501-RQ-002)
  # ──────────────────────────────────────────────
  /api/v1/components:
    get:
      tags: [components]
      summary: List components in a repository
      description: >
        Returns a paginated list of components in the specified repository.
        Supports filtering by namespace, name, and version.
      operationId: listComponents
      parameters:
        - name: repository
          in: query
          required: true
          description: Repository name to list components from
          schema:
            type: string
        - name: namespace
          in: query
          required: false
          description: Filter by component namespace (group)
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Filter by component name
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: Filter by component version
          schema:
            type: string
        - name: continuationToken
          in: query
          required: false
          description: Token for paginated results
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of components
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentSearchResult'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [components]
      summary: Upload a component
      description: >
        Uploads a new component with associated assets to a hosted repository.
        Only hosted repositories accept uploads. Uses multipart form-data
        encoding for binary asset upload.
      operationId: uploadComponent
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComponentUpload'
      responses:
        '201':
          description: Component uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentDetail'
        '400':
          description: Format validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Component already exists (write policy ALLOW_ONCE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/components/{component_id}:
    get:
      tags: [components]
      summary: Get component details
      description: >
        Returns detailed information for a single component including
        all associated assets.
      operationId: getComponent
      parameters:
        - name: component_id
          in: path
          required: true
          description: Component unique identifier
          schema:
            type: integer
      responses:
        '200':
          description: Component details with nested assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentDetail'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [components]
      summary: Delete component
      description: >
        Permanently deletes a component and all associated assets (cascade delete).
      operationId: deleteComponent
      parameters:
        - name: component_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Component deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Component not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Asset Endpoints (F-501-RQ-002)
  # ──────────────────────────────────────────────
  /api/v1/assets:
    get:
      tags: [assets]
      summary: List assets in a repository
      description: Returns a paginated list of assets in the specified repository.
      operationId: listAssets
      parameters:
        - name: repository
          in: query
          required: true
          description: Repository name to list assets from
          schema:
            type: string
        - name: continuationToken
          in: query
          required: false
          description: Token for paginated results
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/assets/{asset_id}:
    get:
      tags: [assets]
      summary: Get asset metadata
      description: >
        Returns metadata for a single asset including checksums (SHA1, SHA256, MD5),
        size, content type, last downloaded timestamp, and download URL.
      operationId: getAsset
      parameters:
        - name: asset_id
          in: path
          required: true
          description: Asset unique identifier
          schema:
            type: integer
      responses:
        '200':
          description: Asset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [assets]
      summary: Delete asset
      description: Permanently deletes an individual asset.
      operationId: deleteAsset
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Asset deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/assets/{asset_id}/download:
    get:
      tags: [assets]
      summary: Download asset binary
      description: >
        Downloads the binary content of an asset. Returns the file with
        appropriate Content-Type and Content-Disposition headers. Updates
        the last_downloaded timestamp. Performance target less than 200ms
        for cached artifacts.
      operationId: downloadAsset
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Asset binary content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
            Content-Type:
              description: MIME type of the asset
              schema:
                type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Search Endpoints (F-103)
  # ──────────────────────────────────────────────
  /api/v1/search:
    get:
      tags: [search]
      summary: Search components
      description: >
        Full-text search across all repositories. Supports keyword search,
        filtering by format and repository, sorting, and pagination with
        faceted aggregation counts. Performance target less than 2 seconds
        for 100K components (F-103).
      operationId: searchComponents
      parameters:
        - name: q
          in: query
          required: false
          description: Keyword search query
          schema:
            type: string
        - name: repository
          in: query
          required: false
          description: Filter by repository name
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Filter by repository format
          schema:
            $ref: '#/components/schemas/RepositoryFormat'
        - name: namespace
          in: query
          required: false
          description: Filter by component namespace (group)
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Filter by component name
          schema:
            type: string
        - name: version
          in: query
          required: false
          description: Filter by component version
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort field
          schema:
            type: string
            enum: [name, version, group, repository, format]
        - name: direction
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          required: false
          description: Page number (zero-based)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: page_size
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Search results with facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/search/assets:
    get:
      tags: [search]
      summary: Search assets
      description: >
        Searches for assets across repositories with keyword and filter support.
      operationId: searchAssets
      parameters:
        - name: q
          in: query
          required: false
          description: Keyword search query
          schema:
            type: string
        - name: repository
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RepositoryFormat'
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, path, size, repository]
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Asset search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/search/assets/sha1/{sha1}:
    get:
      tags: [search]
      summary: Find asset by SHA1 checksum
      description: >
        Looks up assets matching the specified SHA1 checksum across all
        repositories.
      operationId: findAssetBySha1
      parameters:
        - name: sha1
          in: path
          required: true
          description: SHA1 checksum (40 character hexadecimal string)
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{40}$'
            minLength: 40
            maxLength: 40
      responses:
        '200':
          description: Matching assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No matching asset found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/search/browse/{repository_name}:
    get:
      tags: [search]
      summary: Browse repository tree (F-104)
      description: >
        Returns a directory-style listing of components and assets at the
        specified path within a repository. Used for tree navigation.
      operationId: browseRepository
      parameters:
        - name: repository_name
          in: path
          required: true
          description: Repository to browse
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Path within the repository to browse (default is root)
          schema:
            type: string
            default: /
      responses:
        '200':
          description: Directory listing of entries at the browsing path
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                    description: Current browsing path
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Entry name
                        type:
                          type: string
                          enum: [folder, file]
                          description: Entry type
                        path:
                          type: string
                          description: Full path of the entry
                        size:
                          type: integer
                          nullable: true
                          description: File size in bytes (null for folders)
                        last_modified:
                          type: string
                          format: date-time
                          nullable: true
                          description: Last modification timestamp
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Repository or path not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # User Endpoints (F-501-RQ-003, F-301)
  # ──────────────────────────────────────────────
  /api/v1/security/users:
    get:
      tags: [users]
      summary: List all users
      description: >
        Returns all user accounts. CRITICAL: Response never includes
        password_hash, api_key, or failed_login_count fields.
      operationId: listUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [users]
      summary: Create a new user
      description: >
        Creates a new user account. Password policy requires minimum 8
        characters with at least 1 uppercase letter, 1 lowercase letter,
        and 1 digit.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User with this user_id already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (password policy, missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/users/{user_id}:
    get:
      tags: [users]
      summary: Get user by ID
      description: >
        Returns user account details. Never includes password_hash or api_key.
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          description: Unique user identifier
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [users]
      summary: Update user
      description: >
        Updates user account details. Does NOT allow password changes —
        use the change-password endpoint instead.
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [users]
      summary: Delete user
      description: Permanently deletes a user account and all associated role assignments.
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/users/{user_id}/change-password:
    put:
      tags: [users]
      summary: Change user password
      description: >
        Changes the password for a user account. Requires verification of
        the current password before accepting the new password.
      operationId: changePassword
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChangePassword'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully
        '401':
          description: Authentication required or current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: New password does not meet policy requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/users/{user_id}/api-key:
    post:
      tags: [users]
      summary: Generate API key (F-304)
      description: >
        Generates a new API key for the specified user. The API key is
        returned ONLY at generation time and cannot be retrieved later.
      operationId: generateApiKey
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: API key generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiKey'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [users]
      summary: Revoke API key
      description: Revokes the API key for the specified user.
      operationId: revokeApiKey
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found or no API key exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Role Endpoints (F-501-RQ-003, F-301)
  # ──────────────────────────────────────────────
  /api/v1/security/roles:
    get:
      tags: [roles]
      summary: List all roles
      description: >
        Returns all configured roles with their associated privilege lists.
        Optionally filter by source (internal or external).
      operationId: listRoles
      parameters:
        - name: source
          in: query
          required: false
          description: Filter by role source
          schema:
            type: string
            enum: [internal, external]
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [roles]
      summary: Create a new role
      description: Creates a new role with the specified privileges.
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Role with this ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/roles/{role_id}:
    get:
      tags: [roles]
      summary: Get role by ID
      description: Returns a single role with its privilege list.
      operationId: getRole
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [roles]
      summary: Update role
      description: >
        Updates an existing role. Built-in roles (nx-admin, nx-anonymous)
        cannot be modified.
      operationId: updateRole
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cannot modify built-in roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [roles]
      summary: Delete role
      description: >
        Deletes a role. Built-in roles (nx-admin, nx-anonymous) cannot
        be deleted.
      operationId: deleteRole
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cannot delete built-in roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/roles/{role_id}/users:
    put:
      tags: [roles]
      summary: Bulk assign users to role
      description: Replaces the set of users assigned to a role.
      operationId: bulkAssignUsersToRole
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBulkAssignment'
      responses:
        '200':
          description: Users assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/roles/{role_id}/users/{user_id}:
    post:
      tags: [roles]
      summary: Assign user to role
      description: Assigns a single user to a role.
      operationId: assignUserToRole
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User assigned to role
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User assigned to role successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [roles]
      summary: Remove user from role
      description: Removes a user assignment from a role.
      operationId: removeUserFromRole
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User removed from role
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Privilege Endpoints (F-501-RQ-003, F-301)
  # ──────────────────────────────────────────────
  /api/v1/security/privileges:
    get:
      tags: [privileges]
      summary: List all privileges
      description: >
        Returns all configured privileges. Optionally filter by privilege type.
        Five types are supported: application, repository-admin, repository-view,
        repository-content-selector, and wildcard.
      operationId: listPrivileges
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by privilege type
          schema:
            $ref: '#/components/schemas/PrivilegeType'
      responses:
        '200':
          description: List of privileges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Privilege'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [privileges]
      summary: Create a new privilege
      description: >
        Creates a new privilege descriptor. Type-specific properties vary
        by privilege type.
      operationId: createPrivilege
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegeCreate'
      responses:
        '201':
          description: Privilege created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Privilege'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Privilege with this ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/privileges/{privilege_id}:
    get:
      tags: [privileges]
      summary: Get privilege by ID
      description: Returns a single privilege descriptor.
      operationId: getPrivilege
      parameters:
        - name: privilege_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Privilege details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Privilege'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Privilege not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [privileges]
      summary: Update privilege
      description: >
        Updates an existing privilege. Built-in privileges cannot be modified.
      operationId: updatePrivilege
      parameters:
        - name: privilege_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegeCreate'
      responses:
        '200':
          description: Privilege updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Privilege'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Cannot modify built-in privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Privilege not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [privileges]
      summary: Delete privilege
      description: >
        Deletes a privilege. Returns 409 Conflict if the privilege is
        currently in use by any role.
      operationId: deletePrivilege
      parameters:
        - name: privilege_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Privilege deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Privilege not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Privilege is in use by one or more roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Content Selector Endpoints (F-301)
  # ──────────────────────────────────────────────
  /api/v1/security/content-selectors:
    get:
      tags: [privileges]
      summary: List all content selectors
      description: Returns all configured content selector expressions.
      operationId: listContentSelectors
      responses:
        '200':
          description: List of content selectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSelector'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [privileges]
      summary: Create a content selector
      description: >
        Creates a new content selector with a CSEL (Content Selector
        Expression Language) expression for sub-repository access control.
      operationId: createContentSelector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSelectorCreate'
      responses:
        '201':
          description: Content selector created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSelector'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Content selector with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/content-selectors/{selector_id}:
    put:
      tags: [privileges]
      summary: Update content selector
      description: Updates an existing content selector expression.
      operationId: updateContentSelector
      parameters:
        - name: selector_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSelectorCreate'
      responses:
        '200':
          description: Content selector updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSelector'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Content selector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [privileges]
      summary: Delete content selector
      description: Deletes a content selector.
      operationId: deleteContentSelector
      parameters:
        - name: selector_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Content selector deleted
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Content selector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # SSL/TLS Security Endpoints (F-302)
  # ──────────────────────────────────────────────
  /api/v1/security/ssl/truststore:
    get:
      tags: [security]
      summary: List trusted certificates
      description: >
        Returns all certificates in the trusted certificate store. Never
        includes private keys in the response.
      operationId: listTrustedCertificates
      responses:
        '200':
          description: List of trusted certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateInfo'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [security]
      summary: Add trusted certificate
      description: >
        Adds a PEM-encoded certificate to the trusted certificate store.
      operationId: addTrustedCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pem_certificate:
                  type: string
                  description: PEM-encoded X.509 certificate
              required:
                - pem_certificate
      responses:
        '201':
          description: Certificate added to trust store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '400':
          description: Invalid certificate format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/ssl/truststore/{fingerprint}:
    delete:
      tags: [security]
      summary: Remove trusted certificate
      description: >
        Removes a certificate from the trust store by its SHA-256 fingerprint.
      operationId: removeTrustedCertificate
      parameters:
        - name: fingerprint
          in: path
          required: true
          description: SHA-256 fingerprint of the certificate to remove
          schema:
            type: string
      responses:
        '204':
          description: Certificate removed from trust store
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/ssl/certificate:
    get:
      tags: [security]
      summary: Retrieve remote server certificate
      description: >
        Connects to a remote host and retrieves its SSL certificate for
        review before adding to the trust store.
      operationId: getRemoteCertificate
      parameters:
        - name: host
          in: query
          required: true
          description: Remote server hostname
          schema:
            type: string
        - name: port
          in: query
          required: false
          description: Remote server port (default 443)
          schema:
            type: integer
            default: 443
      responses:
        '200':
          description: Remote server certificate information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '400':
          description: Unable to connect to remote host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/security/ssl/ldap:
    put:
      tags: [security]
      summary: Configure LDAP SSL settings
      description: >
        Configures SSL/TLS settings for LDAP directory integration
        including certificate verification and protocol settings.
      operationId: configureLdapSsl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                protocol:
                  type: string
                  enum: [ldaps, starttls]
                  description: LDAP SSL protocol
                verify_certificate:
                  type: boolean
                  default: true
                  description: Whether to verify the LDAP server certificate
                trusted_certificate_pem:
                  type: string
                  nullable: true
                  description: PEM-encoded certificate to trust for LDAP connections
      responses:
        '200':
          description: LDAP SSL settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: LDAP SSL configuration updated successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # Task Endpoints (F-402, F-501-RQ-004)
  # ──────────────────────────────────────────────
  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: List task definitions
      description: >
        Returns all scheduled task definitions. Optionally filter by task type.
      operationId: listTasks
      parameters:
        - name: type
          in: query
          required: false
          description: Filter by task type (e.g., repository.cleanup, blobstore.compact)
          schema:
            type: string
      responses:
        '200':
          description: List of task definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDefinition'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [tasks]
      summary: Create a new scheduled task
      description: >
        Creates a new task definition with cron scheduling. Supports standard
        5-field cron expressions. Task types include repository.cleanup,
        blobstore.compact, repository.rebuild-index, and more.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDefinition'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (invalid cron expression, unknown task type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Get task definition
      description: Returns a single task definition with its configuration.
      operationId: getTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task definition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDefinition'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [tasks]
      summary: Update task definition
      description: Updates an existing task definition including schedule and configuration.
      operationId: updateTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDefinition'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [tasks]
      summary: Delete task definition
      description: Permanently deletes a scheduled task definition.
      operationId: deleteTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{task_id}/run:
    post:
      tags: [tasks]
      summary: Run task immediately
      description: >
        Triggers immediate execution of a task regardless of its cron
        schedule. Returns 202 Accepted as execution is asynchronous.
      operationId: runTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Task execution initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task execution initiated
                  execution_id:
                    type: string
                    description: Execution tracking identifier
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{task_id}/stop:
    post:
      tags: [tasks]
      summary: Stop running task
      description: Requests cancellation of a currently running task execution.
      operationId: stopTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task stop requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task stop requested
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tasks/{task_id}/executions:
    get:
      tags: [tasks]
      summary: Get task execution history
      description: >
        Returns the execution history for a specific task including status,
        duration, and error details.
      operationId: getTaskExecutions
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task execution history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskExecution'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ──────────────────────────────────────────────
  # System Endpoints (F-404, F-501-RQ-004)
  # ──────────────────────────────────────────────
  /api/v1/system/status:
    get:
      tags: [system]
      summary: Get system status
      description: >
        Returns overall system status including version information, uptime,
        node identifier, database type, Elasticsearch availability, and
        aggregate counts of resources.
      operationId: getSystemStatus
      responses:
        '200':
          description: System status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/config:
    get:
      tags: [system]
      summary: List system configuration values
      description: >
        Returns system configuration key-value pairs. Optionally filter
        by category. Sensitive values (containing password, secret, token,
        or key in the key name) are automatically masked.
      operationId: listSystemConfig
      parameters:
        - name: category
          in: query
          required: false
          description: Filter by configuration category
          schema:
            type: string
            enum: [security, http, system, email, repository, cleanup, scheduling]
      responses:
        '200':
          description: List of system configuration values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/config/{key}:
    get:
      tags: [system]
      summary: Get single configuration value
      description: >
        Returns a single configuration value by key. Sensitive values are
        masked in the response.
      operationId: getSystemConfigValue
      parameters:
        - name: key
          in: path
          required: true
          description: Configuration key
          schema:
            type: string
      responses:
        '200':
          description: Configuration value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [system]
      summary: Update configuration value
      description: >
        Updates a system configuration value. Emits a CONFIG_CHANGED event
        for downstream consumers.
      operationId: updateSystemConfigValue
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemConfigUpdate'
      responses:
        '200':
          description: Configuration value updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfig'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuration key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid configuration value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/support-zip:
    post:
      tags: [system]
      summary: Generate support ZIP (F-403)
      description: >
        Generates a diagnostic support ZIP bundle containing sanitized
        system configuration, application logs, thread dump, database
        metrics, and BlobStore metrics. Sensitive values are automatically
        redacted.
      operationId: generateSupportZip
      responses:
        '200':
          description: Support ZIP file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: ZIP file attachment
              schema:
                type: string
                example: attachment; filename=support-bundle.zip
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/license:
    get:
      tags: [system]
      summary: Get license information
      description: >
        Returns the current license details including product name,
        edition (OSS or PRO), license type, available features,
        expiration date, and validity status.
      operationId: getLicense
      responses:
        '200':
          description: License information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseInfo'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/system/config/email/verify:
    post:
      tags: [system]
      summary: Verify email/SMTP configuration
      description: >
