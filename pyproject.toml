[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-repository"
version = "1.0.0"
description = "Sonatype Nexus Repository Manager — Python/Flask Implementation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
authors = [
    {name = "Nexus Repository Team"}
]
keywords = ["repository", "artifact", "maven", "npm", "docker", "pypi", "nuget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    # Core Framework
    "Flask>=3.1.3,<4.0",
    "gunicorn>=23.0.0,<24.0",
    "flask-smorest>=0.45.0,<1.0",

    # Database and ORM
    "SQLAlchemy>=2.0.46,<2.1",
    "Flask-SQLAlchemy>=3.1.1,<4.0",
    "alembic>=1.14.1,<2.0",
    "Flask-Migrate>=4.0.7,<5.0",
    "psycopg2-binary>=2.9.10,<3.0",

    # Authentication and Security
    "Flask-Login>=0.6.3,<1.0",
    "PyJWT>=2.10.1,<3.0",
    "bcrypt>=4.2.1,<5.0",
    "cryptography>=44.0.0,<45.0",
    "python-ldap>=3.4.4,<4.0",

    # Scheduling
    "APScheduler>=3.11.2,<4.0",

    # Search and Indexing
    "Whoosh>=2.7.4,<3.0",
    "elasticsearch>=8.17.0,<9.0",

    # Cloud and Storage
    "boto3>=1.36.7,<2.0",

    # Serialization and Validation
    "marshmallow>=3.25.1,<4.0",
    "PyYAML>=6.0.2,<7.0",

    # Metrics and Observability
    "prometheus-client>=0.21.1,<1.0",

    # Utilities
    "requests>=2.32.3,<3.0",
    "Flask-CORS>=5.0.1,<6.0",
    "python-dotenv>=1.0.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9.0",
    "pytest-cov>=6.0.0,<7.0",
    "pytest-flask>=1.3.0,<2.0",
    "pytest-mock>=3.14.0,<4.0",
    "factory-boy>=3.3.1,<4.0",
    "Faker>=33.3.1,<34.0",
    "moto>=5.0.27,<6.0",
    "flake8>=7.1.1,<8.0",
    "black>=24.10.0,<25.0",
    "mypy>=1.14.1,<2.0",
]

[project.scripts]
nexus = "src.app:create_app"

[project.urls]
Homepage = "https://github.com/nexus-repository/nexus-repository-python"
Documentation = "https://github.com/nexus-repository/nexus-repository-python/tree/main/docs"
Repository = "https://github.com/nexus-repository/nexus-repository-python"
Issues = "https://github.com/nexus-repository/nexus-repository-python/issues"

# --- Tool Configuration ---

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 120
target-version = ["py313"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "flask_smorest.*",
    "flask_login.*",
    "flask_cors.*",
    "flask_migrate.*",
    "apscheduler.*",
    "whoosh.*",
    "ldap.*",
    "boto3.*",
    "botocore.*",
    "moto.*",
    "marshmallow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*", "venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
