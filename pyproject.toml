[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nexus-repository"
version = "1.0.0"
description = "Sonatype Nexus Repository Manager - Python/Flask Rewrite"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "EPL-1.0"}

dependencies = [
    "Flask==3.1.3",
    "gunicorn==23.0.0",
    "flask-smorest==0.45.0",
    "SQLAlchemy==2.0.46",
    "Flask-SQLAlchemy==3.1.1",
    "alembic==1.14.1",
    "Flask-Migrate==4.0.7",
    "psycopg2-binary==2.9.10",
    "Flask-Login==0.6.3",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "cryptography==44.0.0",
    "python-ldap==3.4.4",
    "APScheduler==3.11.2",
    "Whoosh==2.7.4",
    "elasticsearch==8.17.0",
    "boto3==1.36.7",
    "marshmallow==3.25.1",
    "PyYAML==6.0.2",
    "prometheus-client==0.21.1",
    "requests==2.32.3",
    "Flask-CORS==5.0.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-flask==1.3.0",
    "pytest-mock==3.14.0",
    "factory-boy==3.3.1",
    "moto==5.0.27",
    "Faker==33.3.1",
    "flake8==7.1.1",
    "black==24.10.0",
    "mypy==1.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*", "venv/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
