[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-repository-flask"
version = "0.1.0"
description = "Binary Repository Management System - Flask Backend"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "Flask==3.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-JWT-Extended==4.7.1",
    "Flask-Migrate==4.0.7",
    "SQLAlchemy==2.0.36",
    "boto3==1.35.81",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-flask==1.3.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.5.0",
    "pytest-timeout==2.3.1",
    "coverage==7.6.9",
    "responses==0.25.6",
    "moto==5.0.24",
    "factory-boy==3.3.1",
    "Faker==33.1.0",
    "freezegun==1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers --tb=short"
markers = [
    "unit: Unit tests - isolated component tests with mocked dependencies",
    "integration: Integration tests - component interaction tests with test database",
    "functional: Functional tests - end-to-end workflow tests",
    "slow: Slow tests - tests exceeding 5 seconds execution time",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.$",
]

[tool.coverage.html]
directory = "htmlcov"
