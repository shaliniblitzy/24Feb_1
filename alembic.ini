# Alembic Configuration File
# This file is used by Alembic for database migration management.
# It replaces Flyway 8.5.13 from the original Java/Sonatype Nexus stack.
# The sqlalchemy.url is overridden at runtime by migrations/env.py
# which reads from Flask app configuration.

[alembic]
# Path to migration environment
script_location = migrations

# Template used to generate migration file names
# Use a date-prefixed format for ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template date formatting
# timezone =

# Maximum length of revision identifiers
# truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# having their source .py files present
# sourceless = false

# Version file location template
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# Version path separator
# version_path_separator = os
# Use os.pathsep. Default is "os" for backward compatibility.

# Output encoding
output_encoding = utf-8

# Default database URL (overridden by Flask config at runtime)
# Standalone: sqlite:///nexus.db
# Clustered/Production: postgresql://user:pass@host:5432/nexus
sqlalchemy.url = sqlite:///nexus.db

[post_write_hooks]
# Hooks to run after writing new revision files
# Format with Black (line-length 120 matches .flake8 and pyproject.toml)
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = --line-length 120

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
