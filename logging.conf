# =============================================================================
# logging.conf — Python Logging Configuration for Nexus Repository (Flask)
# =============================================================================
# Replaces SLF4J 1.7.36 + Logback 1.2.13 from the Java/Karaf source system.
# Provides structured JSON output for SIEM integration compatibility.
#
# This file uses Python's logging.config INI-style format (fileConfig compatible).
#
# Usage in application code:
#   import logging.config
#   logging.config.fileConfig('logging.conf', disable_existing_loggers=False)
#
# Usage with Gunicorn (production):
#   gunicorn --log-config logging.conf wsgi:app
#
# NOTE: The logs/ directory must exist before file handlers can write.
#       The application factory (create_app) should ensure this directory is created.
#
# NOTE: The JSON formatter uses python-json-logger (pythonjsonlogger) which
#       guarantees valid JSON output by properly escaping all field values.
# =============================================================================

# ---------------------------------------------------------------------------
# Section: Keys — Enumerate all loggers, handlers, and formatters
# ---------------------------------------------------------------------------

[loggers]
keys=root,src_app,src_app_api,src_app_auth,src_app_storage,src_app_scheduler,src_app_events,src_app_audit,sqlalchemy_engine,gunicorn_logger,elasticsearch,boto3,botocore

[handlers]
keys=consoleHandler,fileHandler,auditHandler,errorHandler

[formatters]
keys=jsonFormatter,standardFormatter

# ---------------------------------------------------------------------------
# Section: Logger Definitions
# ---------------------------------------------------------------------------
# Logger hierarchy mirrors the Python package structure (src.app.*).
# Application loggers propagate to root unless explicitly overridden.
# Third-party loggers are set to WARNING to reduce noise in production.
# ---------------------------------------------------------------------------

# Root logger — catches all log records not handled by specific loggers.
# Handlers: console (stdout), file (rotating), error (rotating, ERROR+ only).
[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,errorHandler

# Main application logger — parent of all src.app.* loggers.
# Child loggers inherit handlers via propagation.
[logger_src_app]
level=INFO
handlers=
qualname=src.app
propagate=1

# API request/response logger — covers all Flask route handlers and blueprints.
# Maps to: RESTEasy 6.2.7 JAX-RS resource logging in the Java source.
[logger_src_app_api]
level=INFO
handlers=
qualname=src.app.api
propagate=1

# Authentication and authorization logger — covers realm chain, RBAC, CSEL.
# Maps to: Apache Shiro 2.0.0 security filter logging in the Java source.
[logger_src_app_auth]
level=INFO
handlers=
qualname=src.app.auth
propagate=1

# Storage operations logger — covers BlobStore (File and S3) operations.
# Maps to: BlobStore subsystem logging in the Java source.
[logger_src_app_storage]
level=INFO
handlers=
qualname=src.app.storage
propagate=1

# Task scheduler logger — covers APScheduler job execution and lifecycle.
# Maps to: Quartz 2.3.2 scheduler logging in the Java source.
[logger_src_app_scheduler]
level=INFO
handlers=
qualname=src.app.scheduler
propagate=1

# Event system logger — covers Blinker signal dispatch and subscriber execution.
# Maps to: Guava EventBus logging in the Java source.
[logger_src_app_events]
level=INFO
handlers=
qualname=src.app.events
propagate=1

# Audit trail logger — dedicated handler for security and compliance audit events.
# Writes exclusively to the audit log file (logs/audit.log).
# propagate=0 ensures a clean, dedicated audit trail without duplicate entries
# in the general application log. Feature: F-303 Audit Logging.
[logger_src_app_audit]
level=INFO
handlers=auditHandler
qualname=src.app.audit
propagate=0

# SQLAlchemy SQL query logger — set to WARNING to suppress verbose SQL output.
# Change to INFO or DEBUG for SQL query debugging during development.
# Maps to: MyBatis 3.5.15 / HikariCP 4.0.3 query logging in the Java source.
[logger_sqlalchemy_engine]
level=WARNING
handlers=
qualname=sqlalchemy.engine
propagate=1

# Gunicorn WSGI server logger — covers worker lifecycle and request handling.
# Maps to: Jetty 12.0.5 embedded server logging in the Java source.
# Sub-loggers gunicorn.error and gunicorn.access inherit this configuration.
[logger_gunicorn_logger]
level=INFO
handlers=
qualname=gunicorn
propagate=1

# Elasticsearch client logger — set to WARNING to reduce connection noise.
# Maps to: Elasticsearch 2.4.3 Java client logging in the Java source.
[logger_elasticsearch]
level=WARNING
handlers=
qualname=elasticsearch
propagate=1

# AWS SDK (boto3) logger — set to WARNING to suppress verbose AWS API chatter.
# Maps to: AWS SDK for Java S3 client logging in the Java source.
[logger_boto3]
level=WARNING
handlers=
qualname=boto3
propagate=1

# AWS core (botocore) logger — set to WARNING to suppress low-level AWS noise.
# botocore is the foundation layer of boto3; very verbose at DEBUG/INFO levels.
[logger_botocore]
level=WARNING
handlers=
qualname=botocore
propagate=1

# ---------------------------------------------------------------------------
# Section: Handler Definitions
# ---------------------------------------------------------------------------
# Four handlers provide targeted log routing:
#   - consoleHandler: stdout for development and container environments
#   - fileHandler: rotating file for persistent general application logs
#   - auditHandler: rotating file for dedicated audit trail (F-303)
#   - errorHandler: rotating file for error-level records only
# ---------------------------------------------------------------------------

# Console handler — writes to stdout for development and containerized deployments.
# Level set to DEBUG to allow all records through; filtering is done by loggers.
# Uses JSON formatter for structured output compatible with log aggregators
# (e.g., Fluentd, Logstash, CloudWatch Logs) in containerized environments.
[handler_consoleHandler]
class=logging.StreamHandler
level=DEBUG
formatter=jsonFormatter
args=(sys.stdout,)

# File handler — rotating general application log.
# Max size: 10 MB per file (10485760 bytes).
# Backup count: 5 rotated files retained (total ~60 MB max disk usage).
# Encoding: UTF-8 for proper internationalization support.
[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=DEBUG
formatter=jsonFormatter
args=('logs/nexus.log', 'a', 10485760, 5, 'utf-8')

# Audit handler — rotating audit trail log for compliance and security events.
# Dedicated to the src.app.audit logger (Feature F-303: Audit Logging).
# Max size: 50 MB per file (52428800 bytes) — larger to retain more audit history.
# Backup count: 10 rotated files retained (total ~550 MB max disk usage).
# Encoding: UTF-8 for proper internationalization support.
[handler_auditHandler]
class=logging.handlers.RotatingFileHandler
level=DEBUG
formatter=jsonFormatter
args=('logs/audit.log', 'a', 52428800, 10, 'utf-8')

# Error handler — rotating error-only log for rapid incident diagnosis.
# Level set to ERROR — only ERROR and CRITICAL records are captured.
# Max size: 10 MB per file (10485760 bytes).
# Backup count: 5 rotated files retained.
# Encoding: UTF-8 for proper internationalization support.
[handler_errorHandler]
class=logging.handlers.RotatingFileHandler
level=ERROR
formatter=jsonFormatter
args=('logs/error.log', 'a', 10485760, 5, 'utf-8')

# ---------------------------------------------------------------------------
# Section: Formatter Definitions
# ---------------------------------------------------------------------------
# Two formatters serve different environments:
#   - jsonFormatter: structured JSON for production / SIEM integration
#   - standardFormatter: human-readable output for development
#
# To switch the console handler to human-readable output during development,
# change handler_consoleHandler formatter from jsonFormatter to standardFormatter.
# ---------------------------------------------------------------------------

# JSON formatter — structured output for SIEM integration and log aggregation.
# Uses python-json-logger to guarantee valid JSON output regardless of message
# content (properly escapes special characters like quotes, braces, backslashes).
# Fields: timestamp, level, logger, message, module, function, line, thread, process.
# Date format: ISO 8601 (YYYY-MM-DDTHH:MM:SS) for universal timestamp parsing.
# Replaces: Logback 1.2.13 PatternLayoutEncoder with JSON appender in Java source.
[formatter_jsonFormatter]
format=%(asctime)s %(levelname)s %(name)s %(message)s %(module)s %(funcName)s %(lineno)d %(threadName)s %(process)d
datefmt=%Y-%m-%dT%H:%M:%S
class=pythonjsonlogger.jsonlogger.JsonFormatter

# Standard formatter — human-readable output for development and debugging.
# Format: timestamp [LEVEL] logger.name: message
# Date format: ISO 8601 for consistency with the JSON formatter.
[formatter_standardFormatter]
format=%(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt=%Y-%m-%dT%H:%M:%S
class=logging.Formatter
