# Alembic Configuration File
#
# This configuration file replaces the Flyway 8.5.13 migration management
# from the original Java/Jetty source system. It configures Alembic 1.14.1
# (wrapped by Flask-Migrate 4.0.7) for database schema migration management.
#
# IMPORTANT: When using Flask-Migrate, most configuration — especially the
# database URL — is overridden at runtime by the Flask application config.
# This file provides sensible defaults and logging configuration.
#
# Dual-database architecture support:
#   - Standalone/Development: SQLite (sqlite:///nexus.db)
#   - Production/Clustered:   PostgreSQL (postgresql://user:pass@host:5432/nexus)
#
# Usage:
#   flask db init        — Initialize migrations (already done)
#   flask db migrate     — Auto-generate a migration script
#   flask db upgrade     — Apply pending migrations to the database
#   flask db downgrade   — Revert the last migration
#   flask db current     — Show current migration revision
#   flask db history     — Show migration history

[alembic]

# Path to migration scripts directory.
# This must match the actual directory name containing env.py and versions/.
script_location = migrations

# Template used to generate migration file names.
# Produces filenames like: abc123_add_user_table.py
# %(rev)s  = revision identifier
# %(slug)s = truncated revision message (slugified)
file_template = %%(rev)s_%%(slug)s

# sys.path path prepended to sys.path by the Alembic environment.
# Ensures the project root is in sys.path so that src.app modules
# (models, extensions, factory) can be imported during migration operations.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# as well as the filename. Using UTC for consistency across all
# deployment environments (standalone and clustered).
timezone = UTC

# The output encoding used when revision files are written from script.py.mako.
# output_encoding = utf-8

# SQLAlchemy database URL — FALLBACK ONLY.
# Flask-Migrate overrides this with SQLALCHEMY_DATABASE_URI from Flask app config.
# This default targets the standalone/development SQLite database.
# For production/clustered deployments, the Flask app config will provide:
#   postgresql://user:pass@host:5432/nexus
sqlalchemy.url = sqlite:///nexus.db


# Post-write hooks define scripts or Python functions that are run
# on newly generated revision scripts. Uncomment the lines below to
# enable automatic code formatting with Black on generated migrations.
[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# ---------------------------------------------------------------------------
# Logging Configuration
# ---------------------------------------------------------------------------
# Configures Python logging for Alembic migration operations.
# Replaces the SLF4J 1.7.36 + Logback 1.2.13 migration logging
# from the original Java source system.
#
# Logger hierarchy:
#   root (WARN) ← sqlalchemy.engine (WARN) ← alembic (INFO) ← flask_migrate (INFO)
#
# All loggers propagate to the root logger which outputs to stderr via
# the console handler. This follows the standard logging best practice
# of sending log output to stderr so that stdout remains clean for
# migration script output (offline mode).

[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# Set to INFO to see SQL statements emitted by the engine during migrations.
# Keep at WARN for production to suppress verbose SQL echo output.
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO level provides migration progress visibility:
#   INFO  [alembic.runtime.migration] Running upgrade abc123 -> def456, add user table
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
# INFO level provides Flask-Migrate CLI command output visibility.
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
