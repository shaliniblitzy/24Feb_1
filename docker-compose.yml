# =============================================================================
# Docker Compose - Sonatype Nexus Repository (Python/Flask Backend)
# =============================================================================
# Multi-service orchestration for the Nexus Repository Flask application
# with PostgreSQL (data persistence) and Elasticsearch (content indexing).
#
# Usage:
#   Development:  docker-compose up -d
#   Production:   docker-compose -f docker-compose.yml up -d
#   Stop:         docker-compose down
#   Stop + Data:  docker-compose down -v  (WARNING: removes volumes)
#
# Environment:
#   Copy .env.example to .env and configure before starting.
#   SECRET_KEY and JWT_SECRET_KEY MUST be set for production.
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Flask Application Service (Gunicorn 25.1.0 + Flask 3.1.3)
  # Replaces: Embedded Jetty 12.0.5 HTTP server from Java source
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-app
    ports:
      - "8081:8000"  # Host 8081 (standard Nexus port) -> Container 8000 (Gunicorn)
    environment:
      # Flask application settings
      FLASK_APP: "wsgi:app"
      FLASK_DEBUG: "0"
      # Database connection (PostgreSQL via SQLAlchemy, replaces MyBatis 3.5.15 + HikariCP 4.0.3)
      DATABASE_URL: "postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus}"
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "20"
      DATABASE_POOL_TIMEOUT: "30"
      DATABASE_POOL_RECYCLE: "3600"
      # Elasticsearch connection (replaces Java ES client 2.4.3)
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTICSEARCH_INDEX_PREFIX: "nexus_"
      ELASTICSEARCH_TIMEOUT: "30"
      # Security keys (override via .env file for production)
      SECRET_KEY: "${SECRET_KEY:-change-me-to-a-random-secret-key}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-to-a-random-jwt-secret}"
      JWT_ACCESS_TOKEN_EXPIRES: "3600"
      # Storage configuration
      BLOBSTORE_TYPE: "file"
      BLOBSTORE_PATH: "/app/data/blobs"
      # Logging
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      # Monitoring (replaces Dropwizard Metrics 4.2.25 + Prometheus Client 0.16.0)
      METRICS_ENABLED: "true"
      METRICS_PATH: "/metrics"
      HEALTH_CHECK_PATH: "/api/v1/health"
    env_file:
      - .env
    volumes:
      - ./data/blobs:/app/data/blobs     # BlobStore data (F-201 File BlobStore)
      - ./logs:/app/logs                   # Application and audit logs
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service
  # Replaces: H2 2.3.232 (standalone) / PostgreSQL JDBC 42.7.2 (clustered)
  # Used by: SQLAlchemy 2.0.36 via psycopg2-binary 2.9.10
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    ports:
      - "5432:5432"  # Exposed for debugging; remove or restrict in production
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-nexus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nexus}"
      POSTGRES_DB: "${POSTGRES_DB:-nexus}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    networks:
      - nexus-network

  # ---------------------------------------------------------------------------
  # Elasticsearch Service (Content Indexing and Search - Feature F-103)
  # Version: 7.17.12 (matches elasticsearch-py client version from AAP 0.6.1)
  # Replaces: Elasticsearch 2.4.3 from Java source
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:7.17.12
    container_name: nexus-elasticsearch
    ports:
      - "9200:9200"  # Exposed for debugging; remove or restrict in production
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - cluster.name=nexus-search
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - nexus-network

# =============================================================================
# Named Volumes
# =============================================================================
# Persistent data volumes for stateful services.
# Use 'docker-compose down -v' to remove (WARNING: destroys data).
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: nexus-postgres-data
  elasticsearch_data:
    driver: local
    name: nexus-elasticsearch-data

# =============================================================================
# Networks
# =============================================================================
# Bridge network for inter-service communication.
# All services are isolated on this network.
# =============================================================================
networks:
  nexus-network:
    driver: bridge
    name: nexus-network
